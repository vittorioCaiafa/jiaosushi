<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jiao Sushi | Sign Up</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./scripts/app.js" defer></script>
  </head>
  <body>
    <div class="background-image"></div>

    <section class="auth-section">
      <div class="auth-container">
        <h2>Crear Cuenta</h2>
        <form class="auth-form" id="signup-form">
          <div class="form-group">
            <input type="text" id="name" name="name" placeholder="Nombre" required />
          </div>
          <div class="form-group">
            <input type="email" id="email" name="email" placeholder="Email" required />
          </div>
          <div class="form-group">
            <input type="password" id="password" name="password" placeholder="Contraseña" required />
          </div>
          <div class="form-group">
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirmar Contraseña" required />
          </div>
          <button type="submit" class="auth-btn">Registrarse</button>
        </form>
        <p class="auth-link">
          ¿Ya tienes una cuenta? <a href="./login.html">Iniciar Sesión</a>
        </p>
      </div>
    </section>

    <div id="message-button"></div>
    <div id="chat-modal"></div>
  </body>
</html>
