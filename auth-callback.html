<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - Jiao Sushi</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <script type="module">
        import { handleAuthCallback, getBasePath } from './utils/auth.js';

        window.addEventListener('load', async () => {
            try {
                await handleAuthCallback();
                window.location.href = getBasePath();
            } catch (error) {
                console.error('Authentication error:', error);
                window.location.href = getBasePath() + 'login.html?error=auth_failed';
            }
        });
    </script>
</body>
</html>
