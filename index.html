<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jiao Sushi | Inicio</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="favicon.ico" type="image/x" />
    <script type="module" src="./scripts/app.js" defer></script>
  </head>

  <body>
    <div class="background-image"></div>

    <div id="navbar"></div>

    <section class="hero">
      <div class="hero-content">
        <div class="hero-text">
          <h1>Jiao Sushi</h1>
          <p>La mejor experiencia gastronómica japonesa en Uruguay desde tu casa</p>
          <a href="./menu.html" class="black-btn">Ver Menú</a>
        </div>
        <div class="hero-features">
          <div class="feature">
            <img src="./utils/images/icons/fresh.png" alt="Ingredientes frescos" />
            <h3>Fresco</h3>
          </div>
          <div class="feature">
            <img src="./utils/images/icons/chef.png" alt="Chef experto" />
            <h3>Experto</h3>
          </div>
          <div class="feature">
            <img src="./utils/images/icons/delivery.png" alt="Entrega rápida" />
            <h3>Rápido</h3>
          </div>
          <div class="feature">
            <img src="./utils/images/icons/quality.png" alt="Calidad premium" />
            <h3>Premium</h3>
          </div>
          <div class="feature">
            <img src="./utils/images/icons/handmade.png" alt="Casero" />
            <h3>Casero</h3>
          </div>
          <div class="feature">
            <img src="./utils/images/icons/tasty.png" alt="Sabroso" />
            <h3>Sabroso</h3>
          </div>
        </div>
      </div>
    </section>

    <div id="comments"></div>
    <div id="footer"></div>

    <div id="message-button"></div>
    <div id="chat-modal"></div>
  </body>
</html>
