  <body>
    <div class="background-image"></div>

    <div id="navbar"></div>

    <section class="hero">

            Sushi casero a tu puerta en

            <img

              class="dynamic-src"

          </div>
          <div class="feature">
            <img
              data-src-github="/jiaosushi/utils/images/icons/chef.png"

              data-src-local="/utils/images/icons/tasty.png"

              class="dynamic-src"

    <div id="comments"></div>
    <div id="footer"></div>

    <div id="message-button"></div>
    <div id="chat-modal"></div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const images = document.querySelectorAll(".dynamic-src");
        const isGitHubPages = window.location.hostname.includes("github.io");

        images.forEach((img) => {
          const src = isGitHubPages
            ? img.dataset.srcGithub
            : img.dataset.srcLocal;
          img.src = src;
        });
      });
    </script>
